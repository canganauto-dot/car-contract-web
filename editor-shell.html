<!doctype html>
<html lang="ar" dir="rtl" data-starting>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>منظومة عقود السيارات</title>
    <style>
      #startupThread { display:none }
      html[data-starting], html[data-starting] body { background:#17222d !important }
      html[data-starting] body > :not(#startupThread) { visibility:hidden !important }
      html[data-starting] body > #startupThread {
        display:block !important; position:fixed; inset:0; width:100vw; height:100dvh;
        z-index:2147483647; background:#17222d; color:#9abed9; pointer-events:none;
      }
      html[data-starting] body > #startupThread.cloud-signin{display:grid!important;place-items:center;pointer-events:auto;overflow:auto;padding:20px;background:linear-gradient(120deg,#102632,#163a43 55%,#18484b)}
      #startupThread.cloud-signin form{box-sizing:border-box;width:min(24rem,100%);padding:clamp(20px,4vw,34px);border-radius:12px;background:#fafcfc;color:#183541;box-shadow:0 18px 80px #081b2940;display:grid;gap:14px;font:18px/1.35 Alyamama,sans-serif}
      #startupThread.cloud-signin label{display:grid;gap:4px}
      #startupThread.cloud-signin h1{font:700 30px/1.35 Alyamama,sans-serif;margin:0 0 6px;padding-bottom:12px;border-bottom:1px solid #d7e1e4}
      #startupThread.cloud-signin input:not([type=checkbox]){box-sizing:border-box;width:100%;height:40px;padding:4px 9px;background:white;color:#152e3b;border:1px solid #b9cbd0;border-radius:5px;font:inherit}
      #startupThread.cloud-signin input:focus-visible{outline:2px solid #36898b;outline-offset:1px}
      #startupThread.cloud-signin input[type=checkbox]{accent-color:#225c60;vertical-align:middle}
      #startupThread.cloud-signin button{position:static;transform:none;padding:8px;background:#20545b;color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}
      #startupThread.cloud-signin button[type=button]{background:#e7eff0;color:#244650}
      #startupThread.cloud-signin output:empty{display:none}
      #startupThread{place-items:center}
      html[data-starting] body > #startupThread{display:grid!important}
      #startupThread button{pointer-events:auto}
      .wait-dots{display:inline-flex;align-items:center;justify-content:center;gap:.25em;color:inherit}
      .wait-dots i{display:block;width:.45em;height:.45em;background:currentColor;border-radius:50%;animation:dot-pulse 1s ease-in-out infinite alternate}
      .wait-dots i:nth-child(2){animation-delay:.18s}.wait-dots i:nth-child(3){animation-delay:.36s}
      #startupThread .wait-dots{font-size:1.65rem}
      button[aria-busy=true]{cursor:progress}
      #taskProgress{display:none;position:fixed;bottom:1rem;left:1rem;padding:.55rem .8rem;border-radius:2rem;background:#24445a;color:#fff;z-index:2147483600;pointer-events:none}
      html[data-working]:not([data-starting]) #taskProgress{display:flex;visibility:visible!important}
      @keyframes dot-pulse{0%,20%{opacity:.25}70%,100%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.wait-dots i{animation:none}.wait-dots i:nth-child(1){opacity:.4}.wait-dots i:nth-child(2){opacity:.7}}
    </style>
    <!--STYLES-->
  </head>
  <body class="home-mode" inert>
    <div id="startupThread" role="status" aria-label="جارٍ استرجاع البيانات والتفضيلات">
      <span class="wait-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div id="taskProgress" role="status" aria-label="جارٍ تنفيذ الطلب"><span class="wait-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <header id="toolbar">
      <nav class="bar-group" aria-label="التنقل">
        <button
          id="homeButton"
          title="الرئيسية والأرشيف"
          aria-label="الرئيسية والأرشيف"
        >
          ⌂
        </button>
      </nav>
      <div class="fill-tools">
        <label>العدد<input id="contractNumber" type="text" dir="ltr" maxlength="50" placeholder="تلقائي" autocomplete="off" /></label
        ><label>التاريخ<input id="contractDate" type="date" /></label>
        <label
          >الساعة<input
            id="contractTime"
            type="time"
            title="امسح القيمة لاعتماد وقت الطباعة"
        /></label>
        <label
          >نوع العقد<select id="archiveContractType">
            <option value="installment">أقساط</option>
            <option value="cash">كاش</option>
            <option value="external">خارجي</option>
            <option value="exchange">استبدال</option>
          </select></label
        >
        <select
          id="printSides"
          title="اختر نفس الوضع من إعدادات الطابعة"
          aria-label="طريقة الطباعة"
        >
          <option value="simplex">وجه واحد</option>
          <option value="duplex">وجهان</option>
        </select>
      </div>
      <div class="design-tools">
        <button data-action="leave" title="حفظ المسودة والعودة للملء">
          الملء</button
        ><button data-action="text" title="إضافة نص">T</button
        ><button data-action="shapes" title="الأشكال">◇</button
        ><button data-action="image" title="إضافة صورة">▧</button
        ><button data-action="table" title="إضافة جدول">▦</button
        ><button data-action="page" title="إضافة صفحة">＋ صفحة</button><button data-action="qr" title="تعديل باركود الصفحة">QR</button
        ><span class="divider"></span
        ><button data-action="undo" title="تراجع Ctrl+Z">↶</button
        ><button data-action="redo" title="إعادة Ctrl+Y">↷</button
        ><button data-action="duplicate" title="نسخ العنصر Ctrl+D">⧉</button
        ><button data-action="delete" title="حذف Delete">⌫</button
        ><button id="layoutPrint">ترتيب الطباعة</button>
        <button data-action="approve" class="primary">اعتماد التصميم</button>
      </div>

      <span id="saveStatus" role="status"></span>
      <div class="bar-group bar-files" role="group" aria-label="ملفات المستند">
        <button id="printShortcut" title="طباعة العقد">⎙</button>
        <button id="exportShortcut" title="تصدير بيانات العقد JSON">↓</button>
        <button
          id="loadContract"
          title="استيراد مستند JSON"
          aria-label="استيراد مستند JSON"
        >
          ↑
        </button>
      </div>
      <div class="bar-group" role="group" aria-label="إعدادات الواجهة">
        <button id="themeToggle" title="تبديل المظهر" aria-label="تبديل المظهر">
          ◐
        </button>
        <button id="settingsShortcut" title="الإعدادات">⚙</button>
      </div>
      <button id="previewToggle" hidden></button>
    </header>
    <!--MENU-->
    <main class="workspace">
      <aside id="pageRail" data-build></aside>
      <section id="canvas">
        <div class="preview-controls">
          <label class="page-control"
            >الصفحة<select id="pagePreview">
              <option value="all">كل الصفحات</option>
            </select></label
          ><select id="zoom" aria-label="التكبير">
            <option value="fit">ملاءمة</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
          </select>
        </div>
        <div id="pages" data-build></div>
        <div id="selectionLayer" data-build></div>
      </section>
      <aside id="fillPanel"><!--CARDS--></aside>
      <!--EDITOR-->
    </main>
    <div id="shapePicker" hidden>
      <b>الأشكال</b>
      <div id="shapesGrid" data-build></div>
    </div>
    <input
      id="editorImageFile"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      hidden
    />
    <div class="drawer-shade" id="shade" hidden></div>
    <!--SETTINGS-->
    <!--FEATURES-->
    <!--SCRIPTS-->
  </body>
</html>
